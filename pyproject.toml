[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiji-tracker"
version = "0.1.0"
description = "Enterprise Fiji Infrastructure Voice-to-GIS Tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "google-generativeai>=0.4.0,<0.5.0",
    "supabase>=2.0.0",
    "pydeck>=0.8.0,<1.0.0",
    "loguru>=0.7.2,<0.8.0",
    "pandas>=2.2.0,<3.0.0",
    "plotly>=5.19.0,<6.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["core", "models", "services", "components", "views", "utils"]